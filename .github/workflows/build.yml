name: Build, test and package

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  linux-tests:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Allow Chrome's sandbox on Ubuntu 24.04 (browser agent tests)
        # Ubuntu restricts unprivileged user namespaces via AppArmor, which Chrome's sandbox needs.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Start a real mail server (GreenMail, IMAP 3143 / SMTP 3025)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/greenmail.jar" https://repo1.maven.org/maven2/com/icegreen/greenmail-standalone/2.1.3/greenmail-standalone-2.1.3.jar
          nohup java -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=127.0.0.1 -jar "$RUNNER_TEMP/greenmail.jar" > "$RUNNER_TEMP/greenmail.log" 2>&1 &
          for i in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/3143) 2>/dev/null && break; sleep 1; done
      - name: Test core and runtime
        env:
          JARVIS_TEST_MAIL: 127.0.0.1
          JARVIS_REQUIRE_BROWSER: "1"
        run: |
          dotnet test tests/Jarvis.Core.Tests -c Release --logger "console;verbosity=normal"
          dotnet test tests/Jarvis.Runtime.Tests -c Release --logger "console;verbosity=normal"

  ollama-live:
    name: Real local AI (Ollama) end to end
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Ollama and pull small real models
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # The installer starts a systemd service; start one ourselves only if it didn't.
          curl -sf http://127.0.0.1:11434/api/tags > /dev/null || (ollama serve > /tmp/ollama.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/tags > /dev/null && break; sleep 1; done
          pull() { for attempt in 1 2 3 4; do ollama pull "$1" > /dev/null 2>&1 && return 0; echo "pull $1 failed (attempt $attempt), retrying"; sleep $((attempt * 10)); done; return 1; }
          pull qwen2.5:3b
          pull all-minilm
          # The vision model JARVIS recommends, in its small size; the untagged alias is what a user who typed
          # "qwen2.5vl" has, so the test also covers name resolution and two tags sharing one digest.
          pull qwen2.5vl:3b
          ollama cp qwen2.5vl:3b qwen2.5vl
          pull bge-m3
          ollama list
      - name: Live AI tests
        env:
          JARVIS_OLLAMA_URL: http://127.0.0.1:11434
          JARVIS_OLLAMA_MODEL: qwen2.5:3b
          JARVIS_OLLAMA_EMBED_MODEL: all-minilm
          JARVIS_OLLAMA_VISION_MODEL: qwen2.5vl
          JARVIS_OLLAMA_ML_EMBED_MODEL: bge-m3
        run: dotnet test tests/Jarvis.Core.Tests -c Release --filter "FullyQualifiedName~OllamaLiveTests" --logger "console;verbosity=normal"
      - name: Ollama log
        if: always()
        run: tail -n 80 /tmp/ollama.log 2>/dev/null || journalctl -u ollama --no-pager -n 80 || true

  android:
    name: Android companion app
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Unit tests and debug APK
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-companion-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  windows:
    name: Windows build, tests, package, smoke test
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      milestone: ${{ steps.version.outputs.milestone }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
        if: hashFiles('ui/package-lock.json') != ''

      - name: Compute version
        id: version
        shell: pwsh
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          $props = [xml](Get-Content Directory.Build.props)
          $base = ($props.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1).'#text'
          # A commit marked [release] on the default branch builds the exact version and publishes it as a milestone.
          $milestone = "${{ github.event_name }}" -eq "push" -and "${{ github.ref }}" -eq "refs/heads/${{ github.event.repository.default_branch }}" -and $env:HEAD_MESSAGE -match '\[release\]'
          if ("${{ github.ref }}" -like "refs/tags/v*") { $v = "${{ github.ref_name }}".TrimStart("v") } elseif ($milestone) { $v = $base } else { $v = "$base.${{ github.run_number }}" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "milestone=$($milestone.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v"

      - name: Build dashboard UI
        if: hashFiles('ui/package.json') != ''
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build solution
        run: dotnet build Jarvis.slnx -c Release -p:Version=${{ steps.version.outputs.version }}

      - name: Test (core, runtime, Windows integration)
        run: dotnet test Jarvis.slnx -c Release --no-build --logger "console;verbosity=normal" --logger "trx;LogFilePrefix=results"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Package
        shell: pwsh
        run: ./build/package.ps1 -Version ${{ steps.version.outputs.version }} -SkipUi

      - name: Smoke test the packaged app
        shell: pwsh
        run: ./build/smoke-test.ps1

      - name: Upload installer and portable build
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-${{ steps.version.outputs.version }}-windows-x64
          path: |
            artifacts/JARVIS-Setup-x64.exe
            artifacts/JARVIS-Portable-x64.zip
          if-no-files-found: error

      - name: Upload smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-${{ steps.version.outputs.version }}
          path: |
            artifacts/smoke/
            **/TestResults/*.trx
          if-no-files-found: ignore

  # Publishing waits for every job: nothing is released unless the Linux, live-AI, Android and Windows checks all passed.
  release:
    name: Publish release
    needs: [linux-tests, ollama-live, android, windows]
    if: github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.windows.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: JARVIS-${{ needs.windows.outputs.version }}-windows-x64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: JARVIS-companion-android
          path: android-apk
      - name: Collect files
        run: |
          mv android-apk/app-debug.apk dist/JARVIS-Companion-Android-debug.apk
          ls -l dist
          test -s dist/JARVIS-Setup-x64.exe && test -s dist/JARVIS-Portable-x64.zip && test -s dist/JARVIS-Companion-Android-debug.apk

      - name: Publish "latest build" pre-release
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          gh release delete latest-build --yes --cleanup-tag 2>/dev/null || true
          notes="Automatic build of ${{ github.sha }} (version $VERSION). Every check passed: Linux tests, real local AI, Android, Windows tests and the packaged-app smoke test.

          - **JARVIS-Setup-x64.exe** installs JARVIS; **JARVIS-Portable-x64.zip** runs without installing. See README for first-run steps.
          - **JARVIS-Companion-Android-debug.apk** is the phone companion, debug-signed: sideload it (allow installs from this source) and pair it from Settings → Phone."
          gh release create latest-build dist/* --prerelease --target ${{ github.sha }} --title "JARVIS latest build ($VERSION)" --notes "$notes"

      - name: Publish milestone release
        if: needs.windows.outputs.milestone == 'true'
        run: |
          tag="v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then echo "$tag already released; not replacing it."; exit 0; fi
          gh release create "$tag" dist/* --target ${{ github.sha }} --title "JARVIS $VERSION" --generate-notes

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create ${{ github.ref_name }} dist/* --title "JARVIS $VERSION" --generate-notes
