name: Build, test and package

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  linux-tests:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Allow Chrome's sandbox on Ubuntu 24.04 (browser agent tests)
        # Ubuntu restricts unprivileged user namespaces via AppArmor, which Chrome's sandbox needs.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Start a real mail server (GreenMail, IMAP 3143 / SMTP 3025)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/greenmail.jar" https://repo1.maven.org/maven2/com/icegreen/greenmail-standalone/2.1.3/greenmail-standalone-2.1.3.jar
          nohup java -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=127.0.0.1 -jar "$RUNNER_TEMP/greenmail.jar" > "$RUNNER_TEMP/greenmail.log" 2>&1 &
          for i in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/3143) 2>/dev/null && break; sleep 1; done
      - name: Test core and runtime
        env:
          JARVIS_TEST_MAIL: 127.0.0.1
        run: |
          dotnet test tests/Jarvis.Core.Tests -c Release --logger "console;verbosity=normal"
          dotnet test tests/Jarvis.Runtime.Tests -c Release --logger "console;verbosity=normal"

  ollama-live:
    name: Real local AI (Ollama) end to end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Ollama and pull small real models
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # The installer starts a systemd service; start one ourselves only if it didn't.
          curl -sf http://127.0.0.1:11434/api/tags > /dev/null || (ollama serve > /tmp/ollama.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/tags > /dev/null && break; sleep 1; done
          pull() { for attempt in 1 2 3 4; do ollama pull "$1" > /dev/null 2>&1 && return 0; echo "pull $1 failed (attempt $attempt), retrying"; sleep $((attempt * 10)); done; return 1; }
          pull qwen2.5:1.5b
          pull all-minilm
          ollama list
      - name: Live AI tests
        env:
          JARVIS_OLLAMA_URL: http://127.0.0.1:11434
          JARVIS_OLLAMA_MODEL: qwen2.5:1.5b
          JARVIS_OLLAMA_EMBED_MODEL: all-minilm
        run: dotnet test tests/Jarvis.Core.Tests -c Release --filter "FullyQualifiedName~OllamaLiveTests" --logger "console;verbosity=normal"
      - name: Ollama log
        if: always()
        run: tail -n 80 /tmp/ollama.log 2>/dev/null || journalctl -u ollama --no-pager -n 80 || true

  android:
    name: Android companion app
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Unit tests and debug APK
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-companion-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  windows:
    name: Windows build, tests, package, smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
        if: hashFiles('ui/package-lock.json') != ''

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          $props = [xml](Get-Content Directory.Build.props)
          $base = ($props.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1).'#text'
          if ("${{ github.ref }}" -like "refs/tags/v*") { $v = "${{ github.ref_name }}".TrimStart("v") } else { $v = "$base.${{ github.run_number }}" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v"

      - name: Build dashboard UI
        if: hashFiles('ui/package.json') != ''
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build solution
        run: dotnet build Jarvis.slnx -c Release -p:Version=${{ steps.version.outputs.version }}

      - name: Test (core, runtime, Windows integration)
        run: dotnet test Jarvis.slnx -c Release --no-build --logger "console;verbosity=normal" --logger "trx;LogFilePrefix=results"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Package
        shell: pwsh
        run: ./build/package.ps1 -Version ${{ steps.version.outputs.version }} -SkipUi

      - name: Smoke test the packaged app
        shell: pwsh
        run: ./build/smoke-test.ps1

      - name: Upload installer and portable build
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-${{ steps.version.outputs.version }}-windows-x64
          path: |
            artifacts/JARVIS-Setup-x64.exe
            artifacts/JARVIS-Portable-x64.zip
          if-no-files-found: error

      - name: Upload smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-${{ steps.version.outputs.version }}
          path: |
            artifacts/smoke/
            **/TestResults/*.trx
          if-no-files-found: ignore

      - name: Publish "latest build" pre-release
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --yes --cleanup-tag 2>$null
          $notes = "Automatic build of ${{ github.sha }} (version ${{ steps.version.outputs.version }}).`n`nDownload **JARVIS-Setup-x64.exe** to install, or **JARVIS-Portable-x64.zip** to run without installing. See README for first-run steps."
          gh release create latest-build artifacts/JARVIS-Setup-x64.exe artifacts/JARVIS-Portable-x64.zip --prerelease --target ${{ github.sha }} --title "JARVIS latest build (${{ steps.version.outputs.version }})" --notes $notes

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} artifacts/JARVIS-Setup-x64.exe artifacts/JARVIS-Portable-x64.zip --title "JARVIS ${{ steps.version.outputs.version }}" --generate-notes
